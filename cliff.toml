# git-cliff 配置文件
# https://git-cliff.org/docs/configuration
#
# 常用命令：
#   git cliff --unreleased          # 预览未发布的 commit
#   git cliff -o CHANGELOG.md       # 重新生成完整 CHANGELOG
#   git cliff --latest --strip header  # 最新版本的 release notes（CI 用）
#   git cliff --bumped-version      # 推导下一版本号

[changelog]
header = """# Changelog\n
此文件由 [git-cliff](https://git-cliff.org/) 自动生成。\n
"""

body = """
{%- macro remote_url() -%}
<REPO>
{%- endmacro -%}

{%- macro print_commit(commit) -%}
- {% if commit.breaking %}[**breaking**] {% endif %}\
{% if commit.scope %}**({{ commit.scope }})** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim }} \
([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/-/commit/{{ commit.id }}))
{%- endmacro -%}

{% if version -%}
{% if previous.version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ self::remote_url() }}/-/compare/{{ previous.version }}..{{ version }}) — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% endif -%}
{% else -%}
## [未发布]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | striptags | trim }}
{% for commit in commits -%}
{{ self::print_commit(commit=commit) }}
{% endfor %}
{% endfor -%}
{% if version and previous.version %}
---

[View changes on CNB]({{ self::remote_url() }}/-/compare/{{ previous.version }}..{{ version }})
{% endif -%}
"""

footer = """
<!-- generated by git-cliff — do not edit -->
"""
trim = true
postprocessors = [
  { pattern = '<REPO>', replace = "https://cnb.cool/opencamp/learning-nccl/clings" },
]
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false

commit_preprocessors = [
  # 剥离开头的 emoji 前缀
  { pattern = '^[^a-zA-Z]+', replace = "" },
  # issue 编号替换为链接
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/-/issues/${2}))" },
]

commit_parsers = [
  # 逐 commit 跳过：Footer 含 `changelog: ignore`
  { footer = '^changelog: ?ignore', skip = true },

  # Breaking changes 优先级最高
  { message = '^.+!:', group = "<!-- 00 -->💥 Breaking Changes" },
  { body = '(?m)^BREAKING[ -]CHANGE:', group = "<!-- 00 -->💥 Breaking Changes" },

  # 发版 chore 跳过（不进入 changelog）
  { message = '^chore\(release\)', skip = true },
  { message = '^chore: release', skip = true },

  # 常规分组（HTML comment 前缀确保确定性排序，渲染时 striptags 剥离）
  { message = '^feat', group = "<!-- 01 -->✨ 新功能" },
  { message = '^fix', group = "<!-- 02 -->🐛 Bug 修复" },
  { message = '^doc', group = "<!-- 03 -->📝 文档" },
  { message = '^refactor', group = "<!-- 04 -->♻️ 重构" },
  { message = '^perf', group = "<!-- 05 -->⚡️ 性能优化" },
  { message = '^style', group = "<!-- 06 -->🎨 代码风格" },
  { message = '^test', group = "<!-- 07 -->✅ 测试" },
  { message = '^revert', group = "<!-- 10 -->⏪ 回退" },

  # build / chore / ci 合并为一组
  { message = '^(build|chore|ci)', group = "<!-- 08 -->⚙️ 杂项" },

  # 兜底
  { message = '.*', group = "<!-- 99 -->🌀 其他" },
]

protect_breaking_commits = false
filter_commits = false
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+.*'
topo_order = false
sort_commits = "oldest"

# issue 编号自动链接
link_parsers = [
  { pattern = '#(\d+)', href = "<REPO>/-/issues/$1" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v0.0.0"
