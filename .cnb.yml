# =============================================================================
# CNB CI: clings CLI
# 仓库: q.qq/opencamp-c-2026-summer/clings (cli 分支)
# 发布: https://pypi.org/project/clings/
# 镜像: opencamp-c-env/ci（含 gcc/ncurses/32位支持/python3）
#
# 策略:
#   push     → unit1 + unit2 并行测试 + Build（日常验证）
#   tag_push → unit1 + unit2 并行测试 + Build + Publish to PyPI（发版）
#
# 每个 unit 流水线包含 5 个 stage:
#   Init → List → Run → Check → Score
# =============================================================================

# YAML 锚点: 复用 docker 配置
x-docker: &ci-docker
  docker:
    image: docker.cnb.cool/opencamp/learning-nccl/opencamp-c-env/ci:latest

cli:
  # ====== 日常 push: unit1 + unit2 并行测试 + Build ======
  push:
    # --- Unit 1 流水线 ---
    - name: unit1
      <<: *ci-docker
      stages:
        - name: Init
          script: |
            pip3 install --break-system-packages -e .
            clings doctor
            cd /tmp && mkdir -p clings-ci-unit1 && cd clings-ci-unit1
            clings init unit1

        - name: List
          script: |
            cd /tmp/clings-ci-unit1
            clings list unit1

        - name: Run
          script: |
            cd /tmp/clings-ci-unit1
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            EXERCISES=$(clings list unit1 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | awk '{print $5}' | grep -v '^$')
            for ex in $EXERCISES; do
              echo "--- run $ex ---"
              clings run "$ex" --solutions || exit 1
            done

        - name: Check
          script: |
            cd /tmp/clings-ci-unit1
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings check unit1 --solutions

        - name: Score
          script: |
            cd /tmp/clings-ci-unit1
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings score unit1 --solutions
            echo "--- JSON Report ---"
            clings score unit1 --solutions --json

    # --- Unit 2 流水线（与 Unit 1 并行）---
    - name: unit2
      <<: *ci-docker
      stages:
        - name: Init
          script: |
            pip3 install --break-system-packages -e .
            clings doctor
            cd /tmp && mkdir -p clings-ci-unit2 && cd clings-ci-unit2
            clings init unit2

        - name: List
          script: |
            cd /tmp/clings-ci-unit2
            clings list unit2

        - name: Run
          script: |
            cd /tmp/clings-ci-unit2
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            EXERCISES=$(clings list unit2 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | awk '{print $5}' | grep -v '^$')
            for ex in $EXERCISES; do
              echo "--- run $ex ---"
              clings run "$ex" --solutions || exit 1
            done

        - name: Check
          script: |
            cd /tmp/clings-ci-unit2
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings check unit2 --solutions

        - name: Score
          script: |
            cd /tmp/clings-ci-unit2
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings score unit2 --solutions
            echo "--- JSON Report ---"
            clings score unit2 --solutions --json

    # --- Build 流水线（与测试并行）---
    - name: build
      <<: *ci-docker
      stages:
        - name: Build
          script: |
            pip3 install --break-system-packages build
            python3 -m build

  # ====== 打 Tag 发版: 测试 + Build + Publish ======
  tag_push:
    # --- Unit 1 验证 ---
    - name: unit1
      <<: *ci-docker
      stages:
        - name: Init
          script: |
            pip3 install --break-system-packages -e .
            cd /tmp && mkdir -p clings-ci-unit1 && cd clings-ci-unit1
            clings init unit1

        - name: Check
          script: |
            cd /tmp/clings-ci-unit1
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings check unit1 --solutions

        - name: Score
          script: |
            cd /tmp/clings-ci-unit1
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings score unit1 --solutions
            clings score unit1 --solutions --json

    # --- Unit 2 验证 ---
    - name: unit2
      <<: *ci-docker
      stages:
        - name: Init
          script: |
            pip3 install --break-system-packages -e .
            cd /tmp && mkdir -p clings-ci-unit2 && cd clings-ci-unit2
            clings init unit2

        - name: Check
          script: |
            cd /tmp/clings-ci-unit2
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings check unit2 --solutions

        - name: Score
          script: |
            cd /tmp/clings-ci-unit2
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings score unit2 --solutions
            clings score unit2 --solutions --json

    # --- Build + Publish ---
    - name: release
      <<: *ci-docker
      stages:
        - name: Build
          script: |
            pip3 install --break-system-packages build twine
            python3 -m build

        - name: Publish to PyPI
          imports:
            - https://cnb.cool/q.qq/opencamp-c-2026-summer/secrets/-/blob/main/values.yml
          script: |
            export TWINE_USERNAME="__token__"
            export TWINE_PASSWORD=${PYPI_TOKEN}
            twine upload --verbose dist/*
