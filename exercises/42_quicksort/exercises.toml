[[exercises]]
name = "42a_partition"
title = "Lomuto 分区"
unit = "unit2"
lesson = 42
order = 110
mode = "stdout"
source = "42a_partition.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/42_quicksort"
hint = '''
Lomuto 分区: 以 arr[hi] 为 pivot，一次遍历完成分区。

    int partition(int arr[], int lo, int hi) {
        int pivot = arr[hi];
        int i = lo - 1;
        for (int j = lo; j < hi; j++) {
            if (arr[j] <= pivot) {
                i++;
                swap(&arr[i], &arr[j]);
            }
        }
        swap(&arr[i + 1], &arr[hi]);
        return i + 1;
    }

变量含义:
- i: "小于等于区"的右边界（初始在 lo 左边一格）
- j: 扫描指针，从 lo 到 hi-1
- 每次 arr[j] <= pivot，扩展小区并换入

最后把 pivot 放到 i+1 位置，左边都 <= pivot，右边都 > pivot。
'''

[[exercises.cases]]
stdout = "4 2 1 3 5 6\npivot index: 4\n"


[[exercises]]
name = "42b_quicksort"
title = "完整快速排序"
unit = "unit2"
lesson = 42
order = 111
mode = "stdout"
source = "42b_quicksort.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/42_quicksort"
hint = '''
快速排序 = partition + 递归:

    void quicksort(int arr[], int lo, int hi) {
        if (lo >= hi) return;           // 递归终止
        int p = partition(arr, lo, hi); // 分区
        quicksort(arr, lo, p - 1);      // 排左半
        quicksort(arr, p + 1, hi);      // 排右半
    }

快排特点:
- 平均 O(n log n)，最坏 O(n^2)（已排序 + 选最后元素为 pivot）
- 原地排序，不需要额外数组
- partition 是核心操作，复用 42a 的实现即可
'''

[[exercises.cases]]
args = ["5", "3", "8", "1", "4", "2"]
stdout = "1 2 3 4 5 8\n"

[[exercises.cases]]
args = ["9", "1", "5", "3", "7"]
stdout = "1 3 5 7 9\n"


[[exercises]]
name = "42c_qsort_generic"
title = "泛型快速排序"
unit = "unit2"
lesson = 42
order = 112
mode = "stdout"
source = "42c_qsort_generic.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/42_quicksort"
hint = '''
泛型快排: 用 void* + size + comparator 支持任意类型。

关键: 计算第 i 个元素地址:
    char *elem_i = (char *)base + i * size;

泛型 swap:
    void generic_swap(void *a, void *b, int size) {
        char tmp[256];
        memcpy(tmp, a, size);
        memcpy(a, b, size);
        memcpy(b, tmp, size);
    }

泛型 partition:
    int generic_partition(void *base, int lo, int hi, int size,
                          int (*cmp)(const void*, const void*)) {
        char *arr = (char *)base;
        char *pivot = arr + hi * size;
        int i = lo - 1;
        for (int j = lo; j < hi; j++) {
            if (cmp(arr + j * size, pivot) <= 0) {
                i++;
                generic_swap(arr + i * size, arr + j * size, size);
            }
        }
        generic_swap(arr + (i+1) * size, arr + hi * size, size);
        return i + 1;
    }

字符串比较器:
    int cmp_str(const void *a, const void *b) {
        return strcmp(*(const char **)a, *(const char **)b);
    }
'''

[[exercises.cases]]
args = ["banana", "apple", "cherry", "date"]
stdout = "apple banana cherry date\n"

[[exercises.cases]]
args = ["hello"]
stdout = "hello\n"

[[exercises.cases]]
args = ["zebra", "ant", "monkey", "bear"]
stdout = "ant bear monkey zebra\n"
