[[exercises]]
name = "35a_stack_basic"
title = "数组实现栈"
unit = "unit2"
lesson = 35
order = 84
mode = "stdout"
source = "35a_stack_basic.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/35_stack_expression_eval"
hint = '''
栈的核心: 数组 + top 指针（初始 -1）。

    int stack[MAX_SIZE];
    int top = -1;

    int is_empty(void) { return top == -1; }
    void push(int val) { stack[++top] = val; }
    int pop(void) { return stack[top--]; }

push 先自增 top 再赋值，pop 先取值再自减。
栈空判断: top == -1。

main 中:
    push(1); push(2); push(3);
    while (!is_empty())
        printf("%d\n", pop());
'''

[[exercises.cases]]
stdout = """3
2
1
"""


[[exercises]]
name = "35b_bracket_match"
title = "栈实现括号匹配"
unit = "unit2"
lesson = 35
order = 85
mode = "stdout"
source = "35b_bracket_match.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/35_stack_expression_eval"
hint = '''
括号匹配算法:

    int check_brackets(const char *s) {
        while (*s) {
            if (*s == '(' || *s == '[' || *s == '{')
                push(*s);
            else if (*s == ')' || *s == ']' || *s == '}') {
                if (is_empty()) return 0;
                char open = pop();
                if (!is_match(open, *s)) return 0;
            }
            s++;
        }
        return is_empty();  // 栈必须为空才算匹配
    }

is_match 判断配对:
    return (open=='(' && close==')') ||
           (open=='[' && close==']') ||
           (open=='{' && close=='}');
'''

[[exercises.cases]]
args = ["(())"]
stdout = "yes\n"

[[exercises.cases]]
args = ["(()"]
stdout = "no\n"

[[exercises.cases]]
args = ["()[]{}"]
stdout = "yes\n"


[[exercises]]
name = "35c_postfix_eval"
title = "后缀表达式求值"
unit = "unit2"
lesson = 35
order = 86
mode = "stdout"
source = "35c_postfix_eval.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/35_stack_expression_eval"
hint = '''
后缀表达式求值:

    int eval_postfix(const char *expr) {
        while (*expr) {
            if (isdigit(*expr)) {
                push(*expr - '0');
            } else {
                int b = pop();  // 先弹出的是右操作数
                int a = pop();  // 后弹出的是左操作数
                switch (*expr) {
                    case '+': push(a + b); break;
                    case '-': push(a - b); break;
                    case '*': push(a * b); break;
                }
            }
            expr++;
        }
        return pop();
    }

关键: 注意 pop 顺序！先 pop 出的是 b（右操作数），再 pop 的是 a（左操作数）。
例: "12+" → push(1), push(2), pop b=2, pop a=1, push(1+2=3)
'''

[[exercises.cases]]
args = ["12+3*4+"]
stdout = "13\n"

[[exercises.cases]]
args = ["53+82-*"]
stdout = "48\n"


[[exercises]]
name = "35d_infix_to_postfix"
title = "中缀转后缀表达式"
unit = "unit2"
lesson = 35
order = 87
mode = "stdout"
source = "35d_infix_to_postfix.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/35_stack_expression_eval"
hint = '''
Shunting Yard 算法:

    void infix_to_postfix(const char *expr, char *output) {
        int j = 0;
        while (*expr) {
            if (isdigit(*expr)) {
                output[j++] = *expr;
            } else if (*expr == '(') {
                push(*expr);
            } else if (*expr == ')') {
                while (peek() != '(')
                    output[j++] = pop();
                pop();  // 弹出 '('
            } else {  // 运算符
                while (!is_empty() && peek() != '(' &&
                       priority(peek()) >= priority(*expr))
                    output[j++] = pop();
                push(*expr);
            }
            expr++;
        }
        while (!is_empty())
            output[j++] = pop();
        output[j] = '\0';
    }

优先级: '*','/' → 2; '+','-' → 1
'''

[[exercises.cases]]
args = ["1+2"]
stdout = "12+\n"

[[exercises.cases]]
args = ["2+3*4"]
stdout = "234*+\n"

[[exercises.cases]]
args = ["(1+2)*3"]
stdout = "12+3*\n"
