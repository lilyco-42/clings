[[exercises]]
name = "46b_dijkstra"
title = "Dijkstra 最短路径算法"
unit = "unit2"
lesson = 46
order = 123
mode = "stdout"
source = "46b_dijkstra.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/46_dijkstra_shortest_path"
hint = '''
Dijkstra 算法核心:
    int dist[MAX_V];  // 源点到各点最短距离
    int visited[MAX_V];

    // 初始化
    for (int i = 0; i < n; i++) { dist[i] = INF; visited[i] = 0; }
    dist[src] = 0;

    for (int count = 0; count < n; count++) {
        // 选未访问中 dist 最小的点 u
        int u = -1, min_d = INT_MAX;
        for (int v = 0; v < n; v++)
            if (!visited[v] && dist[v] != -1 && dist[v] < min_d)
                { min_d = dist[v]; u = v; }

        if (u == -1) break;
        visited[u] = 1;

        // 松弛 u 的所有邻居
        for (int v = 0; v < n; v++) {
            if (!visited[v] && graph[u][v] != -1) {
                int new_d = dist[u] + graph[u][v];
                if (dist[v] == -1 || new_d < dist[v])
                    dist[v] = new_d;
            }
        }
    }

从节点 0 出发的最短距离: 0 8 9 5 7
'''

[[exercises.cases]]
stdout = "0 8 9 5 7\n"


[[exercises]]
name = "46c_print_path"
title = "回溯打印最短路径"
unit = "unit2"
lesson = 46
order = 124
mode = "stdout"
source = "46c_print_path.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/46_dijkstra_shortest_path"
hint = '''
路径回溯: 在 Dijkstra 中记录前驱节点。

    int prev[MAX_V];  // prev[v] = 从源到 v 的最短路径上 v 的前一个节点
    // 初始化 prev[i] = -1
    // 松弛时更新: if (new_d < dist[v]) { dist[v] = new_d; prev[v] = u; }

打印路径: 从终点回溯到源点，存入数组后反转打印。

    void print_path(int prev[], int src, int dst) {
        int path[MAX_V], len = 0;
        for (int v = dst; v != -1; v = prev[v])
            path[len++] = v;
        for (int i = len - 1; i >= 0; i--) {
            printf("%d", path[i]);
            if (i > 0) printf(" -> ");
        }
        printf("\n");
    }

从 0 到 4 的最短路径: 0 -> 3 -> 4 (距离 5+2=7)
'''

[[exercises.cases]]
stdout = "0 -> 3 -> 4\n"
