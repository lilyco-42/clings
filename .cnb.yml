# =============================================================================
# CNB CI: clings CLI
# 仓库: opencamp/learning-nccl/clings (cli 分支)
# 发布: https://pypi.org/project/clings/
# 镜像: opencamp-c-env/ci（含 gcc/ncurses/32 位支持/python3）
#
# 策略:
#   push          → unit0 + unit1 + unit2 并行测试 + Build（日常验证）
#   web_trigger   → 一键发版（验证→bump→changelog→tag→publish→release）
#
# 每个 unit 流水线包含 5 个 stage:
#   Init → List → Run → Check → Score
#
# solutions/ 为 git submodule（私有仓库），通过部署令牌拉取
# =============================================================================

include:
  - .cnb/workflows/release.yml

# YAML 锚点: 复用 docker 配置
x-docker: &ci-docker
  docker:
    image: docker.cnb.cool/opencamp/learning-nccl/opencamp-c-env/ci:latest

cli:
  # ====== 日常 push: unit0 + unit1 + unit2 并行测试 + Build ======
  push:
    # --- Unit 0 流水线 ---
    - name: unit0
      <<: *ci-docker
      stages:
        - name: Init
          imports:
            - https://cnb.cool/opencamp/learning-nccl/secret/-/blob/main/clings.yml
          script: |
            apt-get update -qq && apt-get install -y -qq git
            git config --global url."https://cnb:${SOLUTIONS_DEPLOY_TOKEN}@cnb.cool/".insteadOf "https://cnb.cool/"
            cd /workspace && git submodule update --init
            pip3 install --break-system-packages -e .
            clings doctor
            cd /tmp && mkdir -p clings-ci-unit0 && cd clings-ci-unit0
            clings init unit0

        - name: List
          script: |
            cd /tmp/clings-ci-unit0
            clings list unit0

        - name: Run
          script: |
            cd /tmp/clings-ci-unit0
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings run unit0 --solutions

        - name: Check
          script: |
            cd /tmp/clings-ci-unit0
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings check unit0 --solutions

        - name: Score
          script: |
            cd /tmp/clings-ci-unit0
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings score unit0 --solutions --json

    # --- Unit 1 流水线 ---
    - name: unit1
      <<: *ci-docker
      stages:
        - name: Init
          imports:
            - https://cnb.cool/opencamp/learning-nccl/secret/-/blob/main/clings.yml
          script: |
            apt-get update -qq && apt-get install -y -qq git
            git config --global url."https://cnb:${SOLUTIONS_DEPLOY_TOKEN}@cnb.cool/".insteadOf "https://cnb.cool/"
            cd /workspace && git submodule update --init
            pip3 install --break-system-packages -e .
            clings doctor
            cd /tmp && mkdir -p clings-ci-unit1 && cd clings-ci-unit1
            clings init unit1

        - name: List
          script: |
            cd /tmp/clings-ci-unit1
            clings list unit1

        - name: Run
          script: |
            cd /tmp/clings-ci-unit1
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings run unit1 --solutions

        - name: Check
          script: |
            cd /tmp/clings-ci-unit1
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings check unit1 --solutions

        - name: Score
          script: |
            cd /tmp/clings-ci-unit1
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings score unit1 --solutions --json

    # --- Unit 2 流水线（与 Unit 1 并行）---
    - name: unit2
      <<: *ci-docker
      stages:
        - name: Init
          imports:
            - https://cnb.cool/opencamp/learning-nccl/secret/-/blob/main/clings.yml
          script: |
            apt-get update -qq && apt-get install -y -qq git
            git config --global url."https://cnb:${SOLUTIONS_DEPLOY_TOKEN}@cnb.cool/".insteadOf "https://cnb.cool/"
            cd /workspace && git submodule update --init
            pip3 install --break-system-packages -e .
            clings doctor
            cd /tmp && mkdir -p clings-ci-unit2 && cd clings-ci-unit2
            clings init unit2

        - name: List
          script: |
            cd /tmp/clings-ci-unit2
            clings list unit2

        - name: Run
          script: |
            cd /tmp/clings-ci-unit2
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings run unit2 --solutions

        - name: Check
          script: |
            cd /tmp/clings-ci-unit2
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings check unit2 --solutions

        - name: Score
          script: |
            cd /tmp/clings-ci-unit2
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings score unit2 --solutions --json

    # --- Build 流水线（与测试并行）---
    - name: build
      <<: *ci-docker
      stages:
        - name: Build
          script: |
            pip3 install --break-system-packages build
            python3 -m build

    # --- Test 流水线（clings 自身 pytest 测试，与 Unit/Build 并行）---
    # 验证 clings Python CLI 工具自身的代码质量（非 C 练习题测试）。
    # tests_py/ 目录与 tests/（C 练习题数据）严格隔离，不打包进 wheel。
    # pytest 作为 [project.optional-dependencies] dev 安装，不违反零运行时依赖。
    - name: test
      <<: *ci-docker
      stages:
        - name: Test
          script: |
            cd /workspace
            pip3 install --break-system-packages -e ".[dev]"
            pytest tests_py/ -v --cov=clings --cov-report=term-missing --cov-fail-under=30

# ===== 云原生开发环境 =====
$:
  vscode:
    - docker:
        image: docker.cnb.cool/opencamp/learning-nccl/opencamp-c-env/dev:latest
      runner:
        tags: cnb:arch:amd64
      services:
        - vscode
        - docker
      stages:
        - name: setup
          script: |
            echo "=== C Fundamentals Development Environment ==="
            gcc --version | head -n1
            python3 --version
            clings -v
            echo ""
            echo "📚 开始做题:"
            echo "   clings           # 进入交互式 watch 模式"
            echo "   clings list      # 查看练习列表"
            echo "   clings hint      # 查看当前题目提示"
            echo "   clings score     # 查看当前得分"
            echo ""
            echo "✅ 环境就绪，开始编程吧！"
