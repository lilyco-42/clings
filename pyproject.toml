[project]
name = "clings-win"
version = "4.10.3"
description = "C language exercises with FastAPI + Webview GUI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "OpenCamp C Team" },
]
keywords = ["c", "exercises", "learning", "fastapi", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pywebview>=5.0.0",
]

[project.scripts]
clings = "clings.main:run_server"
clings-gui = "clings.main:run_gui"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/lilyco-42/clings"
Repository = "https://github.com/lilyco-42/clings"
Issues = "https://github.com/lilyco-42/clings/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests_py"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["clings"]

[tool.hatch.build.targets.wheel.force-include]
"exercises" = "clings/exercises"
"clings.toml" = "clings/clings.toml"
"tests" = "clings/tests"
"clings/static/wasm/clang.wasm" = "clings/static/wasm/clang.wasm"
"clings/static/wasm/lld.wasm" = "clings/static/wasm/lld.wasm"
"clings/static/wasm/sysroot.tar" = "clings/static/wasm/sysroot.tar"

[tool.hatch.build.targets.sdist]
include = ["clings/", "exercises/", "tests/", "clings.toml", "pyproject.toml", "README.md", "clings/static/wasm/*.wasm", "clings/static/wasm/*.tar"]
