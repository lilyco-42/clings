[[exercises]]
name = "28a_parse_number"
title = "解析数字"
unit = "unit2"
lesson = 28
order = 59
mode = "stdout"
source = "28a_parse_number.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/28_math_calculator"
hint = '''
strtod 将字符串转为 double，并通过 end 指针告诉你解析到哪里停止：

    char *end;
    double val = strtod(pos, &end);
    if (end == pos) { /* 解析失败 */ }
    pos = end;  // 指针前进到数字后面

打印时区分整数和浮点数：
    if (val == (long)val && val >= -1e15 && val <= 1e15)
        printf("%ld\n", (long)val);
    else
        printf("%.6g\n", val);

注意: 不要用 (int) 强转判断，大数会溢出！用 (long)。

参考: 同目录下的 cmd_math.c。
'''

[[exercises.cases]]
args = ["42"]
stdout = "42\n"

[[exercises.cases]]
args = ["3.14"]
stdout = "3.14\n"

[[exercises.cases]]
args = ["-7"]
stdout = "-7\n"


[[exercises]]
name = "28b_add_sub"
title = "加减法解析器"
unit = "unit2"
lesson = 28
order = 60
mode = "stdout"
source = "28b_add_sub.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/28_math_calculator"
hint = '''
递归下降的核心思想：每个语法规则对应一个函数。

最简单的情况（只有加减法）：
    expr = number (('+' | '-') number)*

对应代码：
    double parse_expr(void) {
        double val = parse_number();    // 先解析第一个数
        skip_spaces();
        while (*pos == '+' || *pos == '-') {   // 循环处理后续运算符
            char op = *pos++;                   // 取出运算符
            double right = parse_number();      // 解析右操作数
            if (op == '+') val += right;
            else val -= right;
            skip_spaces();
        }
        return val;
    }

关键: 循环而非递归处理左结合运算。

参考: 同目录下的 cmd_math.c。
'''

[[exercises.cases]]
args = ["2+3"]
stdout = "5\n"

[[exercises.cases]]
args = ["10-3+2"]
stdout = "9\n"

[[exercises.cases]]
args = ["100"]
stdout = "100\n"


[[exercises]]
name = "28c_mul_div"
title = "乘除法与运算符优先级"
unit = "unit2"
lesson = 28
order = 61
mode = "stdout"
source = "28c_mul_div.c"
cflags = ["-std=c11", "-Wall", "-Wextra", "-O2"]
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/28_math_calculator"
hint = '''
优先级通过函数调用层次实现:
- expr 层处理 + -（优先级低）
- term 层处理 * /（优先级高）

关键变化: expr 中不再直接调用 parse_number()，
而是调用 parse_term()（先算乘除再算加减）。

    parse_expr → parse_term → parse_number
    (+ -)       (* /)        (数字)

    double parse_term(void) {
        double val = parse_number();
        while (*pos == '*' || *pos == '/') {
            char op = *pos++;
            double right = parse_number();
            ...
        }
    }

    double parse_expr(void) {
        double val = parse_term();  // 关键改动！
        while (*pos == '+' || *pos == '-') {
            char op = *pos++;
            double right = parse_term();  // 关键改动！
            ...
        }
    }

参考: 同目录下的 cmd_math.c。
'''

[[exercises.cases]]
args = ["2+3*4"]
stdout = "14\n"

[[exercises.cases]]
args = ["10/2-1"]
stdout = "4\n"

[[exercises.cases]]
args = ["6/3/2"]
stdout = "1\n"


[[exercises]]
name = "28d_full_calc"
title = "完整计算器"
unit = "unit2"
lesson = 28
order = 62
mode = "stdout"
source = "28d_full_calc.c"
cflags = ["-std=c11", "-Wall", "-Wextra", "-O2"]
ldflags = ["-lm"]
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/28_math_calculator"
hint = '''
在 term 层之下再加一个 factor 层处理括号和一元运算:

    expr   = term (('+' | '-') term)*
    term   = factor (('*' | '/') factor)*
    factor = '-' factor | '(' expr ')' | number | func '(' expr ')'

parse_factor 的逻辑:
1. 如果当前字符是 '-': 消耗它，递归调用 parse_factor，取反
2. 如果当前字符是 '(': 消耗它，调用 parse_expr，期望 ')'
3. 如果当前字符是字母: 读取函数名，消耗 '(', 调用 parse_expr, 消耗 ')'
   然后用 strcmp 分派到 sin/cos/sqrt/log/exp 等
4. 否则: 调用 parse_number

注意:
- parse_term 中现在调用 parse_factor 而非 parse_number
- 编译时需要 -lm 链接数学库

参考: 同目录下的 cmd_math.c。
'''

[[exercises.cases]]
args = ["(1+2)*(3+4)"]
stdout = "21\n"

[[exercises.cases]]
args = ["-(-5)"]
stdout = "5\n"

[[exercises.cases]]
args = ["2+3*4"]
stdout = "14\n"

[[exercises.cases]]
args = ["sqrt(16)"]
stdout = "4\n"
