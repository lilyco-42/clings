[[exercises]]
name = "37a_bst_insert"
title = "BST 插入"
unit = "unit2"
lesson = 37
order = 91
mode = "stdout"
source = "37a_bst_insert.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/37_binary_tree_wordfreq"
hint = '''
BST 插入的核心: 递归找到正确的空位置，创建新节点。

    struct node *insert(struct node *root, int val) {
        if (root == NULL)
            return make_node(val);
        if (val < root->data)
            root->left = insert(root->left, val);
        else if (val > root->data)
            root->right = insert(root->right, val);
        return root;
    }

中序遍历 (inorder): 左 → 根 → 右，对 BST 来说结果是有序的。
使用全局变量 first 控制输出格式（元素间空格分隔，末尾无空格）:

    int first = 1;
    void inorder(struct node *root) {
        if (root == NULL) return;
        inorder(root->left);
        if (first) first = 0; else printf(" ");
        printf("%d", root->data);
        inorder(root->right);
    }

参考 37a_bst_insert.c 中的 TODO 注释完成实现。
'''

[[exercises.cases]]
stdout = "1 3 4 5 7\n"


