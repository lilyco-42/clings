[[exercises]]
name = "45a_lcs_length"
title = "LCS 长度计算（DP 填表）"
unit = "unit2"
lesson = 45
order = 119
mode = "stdout"
source = "45a_lcs_length.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/45_lcs_dynamic_programming"
hint = '''
LCS 动态规划填表:

    int dp[M+1][N+1] = {0};  // M, N 为两串长度
    for (int i = 1; i <= m; i++)
        for (int j = 1; j <= n; j++) {
            if (s1[i-1] == s2[j-1])
                dp[i][j] = dp[i-1][j-1] + 1;
            else
                dp[i][j] = dp[i-1][j] > dp[i][j-1] ? dp[i-1][j] : dp[i][j-1];
        }

dp[m][n] 即为 LCS 长度。
命令行参数: argv[1] 和 argv[2] 是两个字符串。
'''

[[exercises.cases]]
args = ["ABCBDAB", "BDCAB"]
stdout = "4\n"

[[exercises.cases]]
args = ["AGGTAB", "GXTXAYB"]
stdout = "4\n"


[[exercises]]
name = "45b_lcs_string"
title = "LCS 回溯输出子序列"
unit = "unit2"
lesson = 45
order = 120
mode = "stdout"
source = "45b_lcs_string.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/45_lcs_dynamic_programming"
hint = '''
回溯 DP 表输出 LCS 字符串:

    void backtrack(char *s1, char *s2, int dp[][N+1], int i, int j, char *buf, int k) {
        if (i == 0 || j == 0) { buf[k] = '\0'; return; }
        if (s1[i-1] == s2[j-1]) {
            backtrack(s1, s2, dp, i-1, j-1, buf, k-1);
            buf[k] = s1[i-1];
        } else if (dp[i-1][j] >= dp[i][j-1]) {
            backtrack(s1, s2, dp, i-1, j, buf, k);
        } else {
            backtrack(s1, s2, dp, i, j-1, buf, k);
        }
    }

或者用迭代方式从 dp[m][n] 向左上回溯。
注意: 当 dp[i-1][j] >= dp[i][j-1] 时往上走（保证确定性输出）。
'''

[[exercises.cases]]
args = ["ABCBDAB", "BDCAB"]
stdout = "BCAB\n"

[[exercises.cases]]
args = ["AGGTAB", "GXTXAYB"]
stdout = "GTAB\n"


[[exercises]]
name = "45c_diff_simple"
title = "基于 LCS 的简单 diff"
unit = "unit2"
lesson = 45
order = 121
mode = "stdout"
source = "45c_diff_simple.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/45_lcs_dynamic_programming"
hint = '''
基于 LCS 的 diff 输出:
1. 先计算两字符串的 LCS
2. 遍历 s1，不在 LCS 中的字符标记为 "- X"（被删除）
3. 遍历 s2，不在 LCS 中的字符标记为 "+ X"（被添加）

回溯时用双指针对齐:
    int i = 0, k = 0;  // i 遍历 s1, k 遍历 lcs
    while (i < len1) {
        if (k < lcs_len && s1[i] == lcs[k]) { i++; k++; }
        else { printf("- %c\n", s1[i]); i++; }
    }
类似处理 s2 输出 "+ X"。
'''

[[exercises.cases]]
args = ["ABCDEF", "ABDEG"]
stdout = """- C
- F
+ G
"""

[[exercises.cases]]
args = ["HELLO", "HALLO"]
stdout = """- E
+ A
"""
