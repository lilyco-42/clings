[[exercises]]
name = "37e_bst_delete"
title = "BST 删除"
unit = "unit2"
lesson = 37
order = 95
mode = "stdout"
source = "37e_bst_delete.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/37_binary_tree_wordfreq"
hint = '''
BST 删除有三种情况:

1. 叶子节点: 直接 free 并返回 NULL
2. 只有一个子树: 返回那个子树（free 当前节点）
3. 有两个子树: 用右子树的最小值替换，然后递归删除那个最小值

    struct node *find_min(struct node *root) {
        while (root->left != NULL)
            root = root->left;
        return root;
    }

    struct node *delete_node(struct node *root, int val) {
        if (root == NULL) return NULL;
        if (val < root->data)
            root->left = delete_node(root->left, val);
        else if (val > root->data)
            root->right = delete_node(root->right, val);
        else {
            if (root->left == NULL) {
                struct node *tmp = root->right;
                free(root);
                return tmp;
            } else if (root->right == NULL) {
                struct node *tmp = root->left;
                free(root);
                return tmp;
            }
            struct node *succ = find_min(root->right);
            root->data = succ->data;
            root->right = delete_node(root->right, succ->data);
        }
        return root;
    }

参考 37e_bst_delete.c 中的 TODO 注释完成实现。
'''

[[exercises.cases]]
stdout = "1 4 5 7\n"
