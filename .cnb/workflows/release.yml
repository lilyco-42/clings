# =============================================================================
# 发版流水线
#
# 两种触发方式:
#
#   A. 一键发版 (web_trigger_release)
#      verify → bump → commit → tag → build → publish → release
#      全自动推导版本号，推荐使用
#
#   B. 手动打 tag (tag_push: v*)
#      verify → build → publish → release
#      跳过 bump/commit/tag（已手动完成），兜底发布
#
# =============================================================================

.release-job: &release-job
  - name: release
    docker:
      image: docker.cnb.cool/opencamp/learning-nccl/opencamp-c-env/ci:latest
    stages:
      # ── Gate: 确保代码健康 ──────────────────────────────────────────
      - name: Install & Verify
        script: |
          set -eu
          # 安装发版依赖（镜像中无 git）
          apt-get update -qq && apt-get install -y -qq git > /dev/null
          pip3 install --break-system-packages -e .
          clings doctor
          cd /tmp && mkdir -p clings-release-verify && cd clings-release-verify
          clings init all
          export CLINGS_SOLUTIONS_DIR=/workspace/solutions
          echo "==> Verifying unit0..."
          clings check unit0 --solutions
          echo "==> Verifying unit1..."
          clings check unit1 --solutions
          echo "==> Verifying unit2..."
          clings check unit2 --solutions
          echo "==> All units passed ✓"

      - name: Build Gate
        script: |
          set -eu
          pip3 install --break-system-packages build
          python3 -m build
          echo "==> Build gate passed ✓ (wheel + sdist OK)"
          rm -rf dist/

      # ── Release: 版本推导 + 发布 ─────────────────────────────────────
      - name: Derive Version
        script: |
          set -eu
          git fetch origin cli --tags --force
          pip3 install --break-system-packages git-cliff 2>/dev/null || {
            curl -sSL https://github.com/orhun/git-cliff/releases/download/v2.7.0/git-cliff-2.7.0-x86_64-unknown-linux-gnu.tar.gz \
              | tar xz -C /usr/local/bin --strip-components=1
          }
          next_tag="$(git cliff --bumped-version --config cliff.toml)"
          echo "##[set-output next_tag=${next_tag}]"
          echo "##[set-output next_version=${next_tag#v}]"
          echo "==> 目标版本: ${next_tag#v} (tag: ${next_tag})"
        exports:
          next_tag: NEXT_TAG
          next_version: NEXT_VERSION

      - name: Bump & Commit
        script: |
          set -eu
          sed -i "s/^version = \".*\"/version = \"${NEXT_VERSION}\"/" pyproject.toml
          echo "==> pyproject.toml version → ${NEXT_VERSION}"
      - name: Push Version
        image: tencentcom/git-commit:latest
        settings:
          add:
            - pyproject.toml
          commitMessage: 'chore(release): ${NEXT_TAG} [skip ci]'
          pushCurrent: true

      - name: Create Tag
        script: |
          set -eu
          git tag -a "${NEXT_TAG}" -m "${NEXT_TAG}" -m "clings ${NEXT_VERSION}"
          git push origin "${NEXT_TAG}"
          echo "==> Tag ${NEXT_TAG} pushed ✓"

      - name: Build
        script: |
          set -eu
          pip3 install --break-system-packages build twine
          python3 -m build
          ls -la dist/

      - name: Publish to PyPI
        imports:
          - https://cnb.cool/q.qq/opencamp-c-2026-summer/secrets/-/blob/main/values.yml
        script: |
          set -eu
          export TWINE_USERNAME="__token__"
          export TWINE_PASSWORD=${PYPI_TOKEN}
          twine upload --verbose dist/*
          echo "==> Published to PyPI ✓"

      - name: Create Release
        script: |
          set -eu
          git cliff --latest --strip header --config cliff.toml > release-notes.md 2>/dev/null || \
            echo "clings ${NEXT_TAG}" > release-notes.md
          cat release-notes.md
      - name: Publish Release
        type: git:release
        options:
          title: clings ${NEXT_TAG}
          descriptionFromFile: release-notes.md
          latest: true
          overlying: true

cli:
  web_trigger_release: *release-job
  api_trigger_release: *release-job

# ── 方式 B: 手动打 tag 兜底发布 ──────────────────────────────────────────
# 跳过版本推导/bump/commit/tag（已手动完成），直接 verify → build → publish
'v*':
  tag_push:
    - name: tag-release
      docker:
        image: docker.cnb.cool/opencamp/learning-nccl/opencamp-c-env/ci:latest
      stages:
        - name: Install & Verify
          script: |
            set -eu
            apt-get update -qq && apt-get install -y -qq git > /dev/null
            pip3 install --break-system-packages -e .
            clings doctor
            cd /tmp && mkdir -p clings-tag-verify && cd clings-tag-verify
            clings init all
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings check unit0 --solutions
            clings check unit1 --solutions
            clings check unit2 --solutions
            echo "==> All units passed ✓"

        - name: Build
          script: |
            set -eu
            pip3 install --break-system-packages build twine
            python3 -m build
            ls -la dist/

        - name: Publish to PyPI
          imports:
            - https://cnb.cool/q.qq/opencamp-c-2026-summer/secrets/-/blob/main/values.yml
          script: |
            set -eu
            export TWINE_USERNAME="__token__"
            export TWINE_PASSWORD=${PYPI_TOKEN}
            twine upload --verbose dist/*
            echo "==> Published to PyPI ✓"

        - name: Create Release
          script: |
            set -eu
            pip3 install --break-system-packages git-cliff 2>/dev/null || true
            git fetch origin cli --tags --force
            git cliff --latest --strip header --config cliff.toml > release-notes.md 2>/dev/null || \
              echo "clings ${CNB_BRANCH}" > release-notes.md
            cat release-notes.md
        - name: Publish Release
          type: git:release
          options:
            title: clings ${CNB_BRANCH}
            descriptionFromFile: release-notes.md
            latest: true
            overlying: true
