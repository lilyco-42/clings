[[exercises]]
name = "36a_queue_basic"
title = "数组实现队列"
unit = "unit2"
lesson = 36
order = 83
mode = "stdout"
source = "36a_queue_basic.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/36_queue_bfs_maze"
hint = '''
队列的核心: 数组 + front/rear 指针（初始都为 0）。

    int queue[MAX_SIZE];
    int front = 0, rear = 0;

    int is_empty(void) { return front == rear; }
    void enqueue(int val) { queue[rear++] = val; }
    int dequeue(void) { return queue[front++]; }

enqueue 在 rear 位置存值并后移，dequeue 从 front 取值并后移。
队空判断: front == rear。

main 中:
    enqueue(10); enqueue(20); enqueue(30);
    while (!is_empty())
        printf("%d\n", dequeue());
'''

[[exercises.cases]]
stdout = """10
20
30
"""


[[exercises]]
name = "36b_bfs_maze"
title = "BFS 解迷宫最短路径"
unit = "unit2"
lesson = 36
order = 84
mode = "stdout"
source = "36b_bfs_maze.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/36_queue_bfs_maze"
hint = '''
BFS 迷宫求解:

    int bfs(void) {
        visited[0][0] = 1;
        enqueue((struct point){0, 0});
        while (!is_empty()) {
            struct point cur = dequeue();
            if (cur.row == N-1 && cur.col == N-1) return 1;
            for (int d = 0; d < 4; d++) {
                int nr = cur.row + dr[d];
                int nc = cur.col + dc[d];
                if (nr>=0 && nr<N && nc>=0 && nc<N
                    && !visited[nr][nc] && maze[nr][nc]==0) {
                    visited[nr][nc] = 1;
                    prev_row[nr][nc] = cur.row;
                    prev_col[nr][nc] = cur.col;
                    enqueue((struct point){nr, nc});
                }
            }
        }
        return 0;
    }

路径回溯: 从终点 (N-1,N-1) 沿 prev 回溯到起点，存入数组后倒序打印:
    struct point path[MAX_SIZE];
    int len = 0;
    int r = N-1, c = N-1;
    while (r != 0 || c != 0) {
        path[len++] = (struct point){r, c};
        int pr = prev_row[r][c], pc = prev_col[r][c];
        r = pr; c = pc;
    }
    path[len++] = (struct point){0, 0};
    for (int i = len-1; i >= 0; i--)
        printf("(%d, %d) ", path[i].row, path[i].col);
    printf("\n");
'''

[[exercises.cases]]
stdout = "(0, 0) (1, 0) (2, 0) (2, 1) (2, 2) (2, 3) (2, 4) (3, 4) (4, 4)\n"
