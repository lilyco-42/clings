[project]
name = "clings"
version = "4.7.0"
description = "Rustlings-style C exercises CLI for OpenCamp C 2026 Summer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "OpenCamp C Team" },
]
keywords = ["c", "exercises", "learning", "rustlings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]

[project.scripts]
clings = "clings:main"

[project.urls]
Homepage = "https://cnb.cool/opencamp/learning-nccl/clings"
Repository = "https://cnb.cool/opencamp/learning-nccl/clings"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["clings"]
branch = true

[tool.coverage.report]
# CI 门槛：核心逻辑模块已达标（config 82% / state 95% / utils 76%），
# commands/* 与 renderer/watch 属 TUI 交互层（known gap），拉低总数。
# 30% 总覆盖率门槛是当前阶段的合理底线，随测试扩展逐步上调。
fail_under = 30
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["clings"]

[tool.hatch.build.targets.wheel.force-include]
"exercises" = "clings/exercises"
"clings.toml" = "clings/clings.toml"
"pyproject.toml" = "clings/pyproject.toml"
"tests" = "clings/tests"

[tool.hatch.build.targets.sdist]
include = ["clings/", "exercises/", "tests/", "clings.toml", "pyproject.toml", "README.md"]
