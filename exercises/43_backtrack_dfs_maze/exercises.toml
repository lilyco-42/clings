[[exercises]]
name = "43a_dfs_visit"
title = "DFS 标记可达格子"
unit = "unit2"
lesson = 43
order = 113
mode = "stdout"
source = "43a_dfs_visit.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/43_backtrack_dfs_maze"
hint = '''
DFS 递归标记可达格子:

    void dfs(int r, int c) {
        visited[r][c] = 1;
        for (int d = 0; d < 4; d++) {
            int nr = r + dr[d], nc = c + dc[d];
            if (nr >= 0 && nr < N && nc >= 0 && nc < N
                && !visited[nr][nc] && maze[nr][nc] == 0) {
                dfs(nr, nc);
            }
        }
    }

DFS vs BFS:
- DFS 用递归（或栈），沿一个方向走到底再回溯
- BFS 用队列，逐层扩展
- 两者都能标记所有可达节点，但路径长度只有 BFS 保证最短
'''

[[exercises.cases]]
stdout = "reachable: 18\n"


[[exercises]]
name = "43b_dfs_path"
title = "DFS 找一条路径"
unit = "unit2"
lesson = 43
order = 114
mode = "stdout"
source = "43b_dfs_path.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/43_backtrack_dfs_maze"
hint = '''
DFS 找路径: 搜索过程中记录路径，找到终点即返回。

    int dfs(int r, int c) {
        path[path_len++] = (struct point){r, c};
        visited[r][c] = 1;

        if (r == N-1 && c == N-1) return 1;  // 到达终点

        for (int d = 0; d < 4; d++) {
            int nr = r + dr[d], nc = c + dc[d];
            if (nr>=0 && nr<N && nc>=0 && nc<N
                && !visited[nr][nc] && maze[nr][nc]==0) {
                if (dfs(nr, nc)) return 1;    // 找到就立即返回
            }
        }

        path_len--;  // 回溯: 此路不通，从路径中移除
        return 0;
    }

方向顺序决定找到哪条路径。用 {下,右,上,左} 可找到较"偏下偏右"的路径。
'''

[[exercises.cases]]
stdout = "(0,0) (1,0) (2,0) (2,1) (2,2) (2,3) (2,4) (3,4) (4,4)\n"


[[exercises]]
name = "43c_dfs_all_paths"
title = "DFS + 回溯找所有路径"
unit = "unit2"
lesson = 43
order = 115
mode = "stdout"
source = "43c_dfs_all_paths.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/43_backtrack_dfs_maze"
hint = '''
回溯法: 搜索完一条路径后，取消标记，探索其他可能。

    void dfs(int r, int c) {
        visited[r][c] = 1;

        if (r == N-1 && c == N-1) {
            count++;     // 找到一条完整路径
        } else {
            for (int d = 0; d < 4; d++) {
                int nr = r + dr[d], nc = c + dc[d];
                if (nr>=0 && nr<N && nc>=0 && nc<N
                    && !visited[nr][nc] && maze[nr][nc]==0) {
                    dfs(nr, nc);
                }
            }
        }

        visited[r][c] = 0;  // 【关键】回溯: 取消标记
    }

回溯 vs 普通 DFS:
- 普通 DFS: visited 一旦标记就不取消，只能找一条路径
- 回溯 DFS: 离开节点时取消 visited，允许其他路径复用该节点
- 回溯可以穷举所有可能的路径
'''

[[exercises.cases]]
stdout = "paths: 2\n"
