hint = '''
djb2 是一个经典的字符串哈希函数:

    unsigned long djb2(const char *str) {
        unsigned long hash = 5381;
        int c;
        while ((c = *str++))
            hash = hash * 33 + c;
        return hash;
    }

初始值 5381 和乘数 33 是经验值，能产生良好的分布。
使用 unsigned long 处理溢出（自动取模）。
输出时用 hash % 1024 限制范围。

