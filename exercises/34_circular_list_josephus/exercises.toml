[[exercises]]
name = "34a_clist_insert"
title = "循环链表插入"
unit = "unit2"
lesson = 34
order = 80
mode = "stdout"
source = "34a_clist_insert.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/34_circular_list_josephus"
hint = '''
循环链表插入的关键: 自环初始化 + cursor 追踪

第一个节点（自环）:
    item->next = item;  // 指向自己
    return item;

后续插入（在 cur 后面）:
    item->next = cur->next;
    cur->next = item;
    return item;  // 返回新节点作为新的 cursor

计算长度: do-while 遍历
    int count = 0;
    link p = cur;
    do { count++; p = p->next; } while (p != cur);
'''

[[exercises.cases]]
stdin = "5\n"
stdout = "5\n"

[[exercises.cases]]
stdin = "1\n"
stdout = "1\n"

[[exercises.cases]]
stdin = "10\n"
stdout = "10\n"


[[exercises]]
name = "34b_clist_delete"
title = "循环链表删除"
unit = "unit2"
lesson = 34
order = 81
mode = "stdout"
source = "34b_clist_delete.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/34_circular_list_josephus"
hint = '''
循环链表删除的关键: 唯一节点特殊处理

唯一节点（item->next == item）:
    free(item->data); free(item);
    return NULL;

一般情况: 找前驱 prev
    link prev = item;
    while (prev->next != item)
        prev = prev->next;
    prev->next = item->next;
    free(item->data); free(item);
    return prev->next;  // 返回被删节点的后继
'''

[[exercises.cases]]
stdin = "5 3\n"
stdout = "1 2 4 5\n"


[[exercises]]
name = "34c_clist_print"
title = "循环链表遍历打印"
unit = "unit2"
lesson = 34
order = 82
mode = "stdout"
source = "34c_clist_print.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/34_circular_list_josephus"
hint = '''
循环链表遍历必须用 do-while（因为起点也要访问）:

    void clist_print(link cur) {
        if (cur == NULL) return;
        link p = cur;
        int first = 1;
        do {
            if (!first) printf(" ");
            printf("%d", *(int *)p->data);
            first = 0;
            p = p->next;
        } while (p != cur);
        printf("\n");
    }

注意: while 循环会跳过第一个节点（如果条件是 p != cur）!
必须用 do-while 确保起始节点也被处理。
'''

[[exercises.cases]]
stdin = "5\n"
stdout = "1 2 3 4 5\n"

[[exercises.cases]]
stdin = "1\n"
stdout = "1\n"

[[exercises.cases]]
stdin = "3\n"
stdout = "1 2 3\n"


[[exercises]]
name = "34d_josephus"
title = "约瑟夫环问题"
unit = "unit2"
lesson = 34
order = 83
mode = "stdout"
source = "34d_josephus.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/34_circular_list_josephus"
hint = '''
约瑟夫环算法:

1. 构建循环链表后，cur 指向最后一个节点:
    // 这样第一次 "走 K 步" 是从节点 1 开始计数

2. 每轮走 K 步找到被淘汰者:
    for (int i = 0; i < k; i++)
        cur = cur->next;
    // 现在 cur 就是要被淘汰的节点

3. 打印并删除:
    printf("%d ", *(int *)cur->data);
    cur = clist_delete(cur);  // 返回删除后的前驱

4. 删除函数的关键:
    - 找前驱: 遍历直到 prev->next == item
    - 如果 item->next == item（最后一个），free 后返回 NULL
    - 否则 prev->next = item->next，free item，返回 prev
'''

[[exercises.cases]]
stdin = "10 3\n"
stdout = "3 6 9 2 7 1 8 5 10 4\n"

[[exercises.cases]]
stdin = "5 2\n"
stdout = "2 4 1 5 3\n"
