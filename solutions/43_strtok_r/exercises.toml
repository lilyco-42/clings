[[exercises]]
name = "43_strtok_r"
title = "strtok_r 线程安全字符串切分"
unit = "unit2"
lesson = 43
order = 91
mode = "stdout"
source = "43_strtok_r.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/43_strtok_r"
hint = '''
// 本题已给出完整实现。观察 strtok_r 如何将原始字符串原地修改为 argv[] 数组。

// strtok_r 的工作原理:
// 1. 首次调用 strtok_r(str, delim, &saveptr): 从 str 开始找 token
// 2. 找到分隔符时，将其替换为 '\0'（原地修改原字符串！）
// 3. saveptr 指向 '\0' 之后的位置（保存上下文）
// 4. 后续调用 strtok_r(NULL, delim, &saveptr): 从 saveptr 继续
// 5. 因此所有 token 指针都指向原 line 内部 — 这就是 argv[] 的构建方式

// strtok 为什么不是线程安全？
// strtok 内部用 static char * 保存切分位置
// 多线程同时调用 strtok 会互相覆盖这个静态变量
// strtok_r 的 _r 后缀 = reentrant（可重入）

// 注意: 如果传入字符串常量（如 strtok_r("hello world", " ", &sp)）
// 会段错误！因为 strtok_r 需要修改原字符串。
'''

[[exercises.cases]]
stdin = "ls -l -a /tmp\n"
stdout = """argc: 4
argv[0]: ls
argv[1]: -l
argv[2]: -a
argv[3]: /tmp
"""

[[exercises.cases]]
stdin = "echo hello\n"
stdout = """argc: 2
argv[0]: echo
argv[1]: hello
"""
