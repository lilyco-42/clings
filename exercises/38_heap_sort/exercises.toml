stdout = "10 5 3 4 1\n"


[[exercises]]
name = "38b_build_heap"
title = "构建最大堆"
unit = "unit2"
lesson = 38
order = 97
mode = "stdout"
source = "38b_build_heap.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/38_heap_sort"
hint = '''
建堆: 从最后一个非叶节点开始，自底向上对每个节点调用 max_heapify。

    void build_max_heap(void) {
        // 最后一个非叶节点的下标是 heap_size/2 - 1
        for (int i = heap_size/2 - 1; i >= 0; i--)
            max_heapify(i);
    }

为什么从后往前? 因为 max_heapify 假设子树已经是合法的堆，
自底向上可以保证这个前提条件。

时间复杂度: O(n)，不是 O(n log n)!

参考 38b_build_heap.c 中的 TODO 注释完成实现。
'''

