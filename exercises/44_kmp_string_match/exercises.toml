[[exercises]]
name = "44a_naive_search"
title = "朴素字符串匹配"
unit = "unit2"
lesson = 44
order = 116
mode = "stdout"
source = "44a_naive_search.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/44_kmp_string_match"
hint = '''
朴素匹配: 在 text 中滑动窗口逐一比较。

    void naive_search(const char *text, const char *pattern) {
        int n = strlen(text), m = strlen(pattern);
        int found = 0;
        for (int i = 0; i <= n - m; i++) {
            int j;
            for (j = 0; j < m; j++) {
                if (text[i + j] != pattern[j]) break;
            }
            if (j == m) {
                if (found > 0) printf(" ");
                printf("%d", i);
                found++;
            }
        }
        if (found == 0) printf("-1");
        printf("\n");
    }

时间复杂度: O(n*m)，最坏情况如 text="AAAA...A", pattern="AAB"。
注意: 外层循环到 n-m（不是 n-1），否则越界。
'''

[[exercises.cases]]
args = ["ABABCABAB", "ABAB"]
stdout = "0 5\n"

[[exercises.cases]]
args = ["hello", "xyz"]
stdout = "-1\n"


[[exercises]]
name = "44b_build_next"
title = "构建 KMP next 表"
unit = "unit2"
lesson = 44
order = 117
mode = "stdout"
source = "44b_build_next.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/44_kmp_string_match"
hint = '''
KMP 前缀函数 (next 表): next[i] = pattern[0..i] 最长真前缀=后缀的长度。

    void build_next(const char *pattern, int m) {
        next_table[0] = 0;
        int len = 0;  // 当前匹配的前缀长度
        int i = 1;
        while (i < m) {
            if (pattern[i] == pattern[len]) {
                len++;
                next_table[i] = len;
                i++;
            } else {
                if (len > 0) {
                    len = next_table[len - 1];  // 回退
                } else {
                    next_table[i] = 0;
                    i++;
                }
            }
        }
    }

示例 "ABABC":
  next[0]=0, next[1]=0, next[2]=1("A"="A"), next[3]=2("AB"="AB"), next[4]=0

关键理解: len = next[len-1] 是利用已计算的前缀信息跳过不必要的比较。
'''

[[exercises.cases]]
args = ["ABABC"]
stdout = "0 0 1 2 0\n"

[[exercises.cases]]
args = ["AABAAAB"]
stdout = "0 1 0 1 2 2 3\n"


[[exercises]]
name = "44c_kmp_search"
title = "KMP 字符串匹配"
unit = "unit2"
lesson = 44
order = 118
mode = "stdout"
source = "44c_kmp_search.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/44_kmp_string_match"
hint = '''
KMP 搜索: 利用 next 表避免重复比较，O(n+m) 复杂度。

    int kmp_search(const char *text, const char *pattern) {
        int n = strlen(text), m = strlen(pattern);
        build_next(pattern, m);

        int i = 0, j = 0;
        while (i < n) {
            if (text[i] == pattern[j]) {
                i++; j++;
            }
            if (j == m) {
                return i - j;  // 找到第一次匹配
            }
            if (i < n && text[i] != pattern[j]) {
                if (j > 0)
                    j = next_table[j - 1];  // 跳过已匹配部分
                else
                    i++;
            }
        }
        return -1;
    }

KMP 的核心思想:
- 匹配失败时，不把 text 指针回退
- 利用 next 表把 pattern 指针跳到正确位置
- 保证 text 指针只前进不后退 → O(n+m)
'''

[[exercises.cases]]
args = ["ABABDABACDABABCABAB", "ABABCABAB"]
stdout = "10\n"

[[exercises.cases]]
args = ["AAAAAB", "AAB"]
stdout = "3\n"
