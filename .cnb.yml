# =============================================================================
# CNB CI: clings CLI — test + build + publish to PyPI.org
# 仓库: q.qq/opencamp-c-2026-summer/clings (cli 分支)
# 发布: https://pypi.org/project/clings/
# =============================================================================

cli:
  push:
    - docker:
        build:
          dockerfile: Dockerfile.ci
      imports:
        - https://cnb.cool/q.qq/opencamp-c-2026-summer/secrets/-/blob/main/values.yml
      stages:
        - name: Install & Test
          script: |
            pip install --break-system-packages -e .
            clings doctor
            cd /tmp && mkdir -p clings-ci-test && cd clings-ci-test
            clings init all
            export CLINGS_SOLUTIONS_DIR=/workspace/solutions
            clings check unit1 --solutions

        - name: Build & Publish to PyPI
          script: |
            pip install --break-system-packages build twine
            export TWINE_USERNAME="__token__"
            export TWINE_PASSWORD=${PYPI_TOKEN}
            python3 -m build
            twine upload dist/*
