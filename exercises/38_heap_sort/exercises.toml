[[exercises]]
name = "38c_heap_sort"
title = "堆排序"
unit = "unit2"
lesson = 38
order = 98
mode = "stdout"
source = "38c_heap_sort.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/38_heap_sort"
hint = '''
堆排序算法:
1. build_max_heap() — 先建堆
2. 循环取出堆顶（最大值）放到数组末尾:

    void heap_sort(void) {
        build_max_heap();
        for (int i = arr_size - 1; i >= 1; i--) {
            swap(0, i);     // 堆顶（最大值）放到末尾
            heap_size--;    // 缩小堆的范围
            max_heapify(0); // 恢复堆性质
        }
    }

排序后数组从小到大排列。时间复杂度: O(n log n)。

参考 38c_heap_sort.c 中的 TODO 注释完成实现。
'''

[[exercises.cases]]
stdout = "1 2 3 4 5 8\n"
