lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/39_hash_table_symbol"
hint = '''
带计数的哈希表: 每个 entry 增加 count 字段。

插入时: 如果 key 已存在则 count++，否则新建节点(count=1)。

排序输出: 为了确定性输出，需要收集所有 entry 后按 key 排序:
    1. 遍历所有桶，将 entry 指针收集到数组
    2. qsort 按 strcmp 排序
    3. 遍历打印 "key:count"

    int compare(const void *a, const void *b) {
        struct entry *ea = *(struct entry **)a;
        struct entry *eb = *(struct entry **)b;
        return strcmp(ea->key, eb->key);
    }

参考 39d_symbol_table.c 中的 TODO 注释完成实现。
'''

