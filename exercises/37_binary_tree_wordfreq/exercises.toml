[[exercises]]
name = "37d_word_freq"
title = "单词频率统计"
unit = "unit2"
lesson = 37
order = 94
mode = "stdout"
source = "37d_word_freq.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/37_binary_tree_wordfreq"
hint = '''
存储字符串的 BST: 用 strcmp 进行比较。

    struct node *insert(struct node *root, const char *w) {
        if (root == NULL)
            return make_node(w);
        int cmp = strcmp(w, root->word);
        if (cmp < 0)
            root->left = insert(root->left, w);
        else if (cmp > 0)
            root->right = insert(root->right, w);
        else
            root->count++;
        return root;
    }

分词: 用 strtok(line, " ") 按空格分割。
注意: fgets 读入的行末尾有 '\n'，需要去掉。

参考 37d_word_freq.c 中的 TODO 注释完成实现。
'''

