[[exercises]]
name = "38a_max_heapify"
title = "最大堆调整"
unit = "unit2"
lesson = 38
order = 96
mode = "stdout"
source = "38a_max_heapify.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/38_heap_sort"
hint = '''
堆的数组表示中，对节点 i:
  - 左子节点: 2*i + 1
  - 右子节点: 2*i + 2

max_heapify: 让节点 i "下沉"到正确位置。

    void max_heapify(int i) {
        int left = 2*i + 1;
        int right = 2*i + 2;
        int largest = i;

        if (left < heap_size && arr[left] > arr[largest])
            largest = left;
        if (right < heap_size && arr[right] > arr[largest])
            largest = right;

        if (largest != i) {
            swap(i, largest);
            max_heapify(largest);  // 递归下沉
        }
    }

参考 38a_max_heapify.c 中的 TODO 注释完成实现。
'''

