[[exercises]]
name = "39b_hash_insert"
title = "哈希表插入与查找"
unit = "unit2"
lesson = 39
order = 100
mode = "stdout"
source = "39b_hash_insert.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/39_hash_table_symbol"
hint = '''
链地址法: 每个桶是一个链表，冲突的元素接在同一桶的链表中。

插入（头插法）:
    void hash_insert(const char *key) {
        unsigned long idx = djb2(key) % TABLE_SIZE;
        // 先检查是否已存在
        for (struct entry *p = table[idx]; p; p = p->next)
            if (strcmp(p->key, key) == 0) return;
        // 不存在则头插
        struct entry *node = malloc(sizeof(struct entry));
        strcpy(node->key, key);
        node->next = table[idx];
        table[idx] = node;
    }

查找:
    int hash_lookup(const char *key) {
        unsigned long idx = djb2(key) % TABLE_SIZE;
        for (struct entry *p = table[idx]; p; p = p->next)
            if (strcmp(p->key, key) == 0) return 1;
        return 0;
    }

参考 39b_hash_insert.c 中的 TODO 注释完成实现。
'''

[[exercises.cases]]
stdout = """banana: found
grape: not found
"""


[[exercises]]
name = "39c_hash_delete"
title = "哈希表删除"
unit = "unit2"
lesson = 39
order = 101
mode = "stdout"
source = "39c_hash_delete.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/39_hash_table_symbol"
hint = '''
链表删除: 需要维护前驱指针 prev。

    void hash_delete(const char *key) {
        unsigned long idx = djb2(key) % TABLE_SIZE;
        struct entry *cur = table[idx];
        struct entry *prev = NULL;

        while (cur != NULL) {
            if (strcmp(cur->key, key) == 0) {
                if (prev == NULL)
                    table[idx] = cur->next;  // 删头节点
                else
                    prev->next = cur->next;  // 删中间/尾节点
                free(cur);
                return;
            }
            prev = cur;
            cur = cur->next;
        }
    }

注意: 删除后要 free 释放内存。

参考 39c_hash_delete.c 中的 TODO 注释完成实现。
'''

[[exercises.cases]]
stdout = """a: found
b: not found
c: found
"""


