[[exercises]]
name = "41a_bsearch_iter"
title = "迭代二分查找"
unit = "unit2"
lesson = 41
order = 106
mode = "stdout"
source = "41a_bsearch_iter.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/41_binary_search"
hint = '''
迭代二分查找: 每次将搜索范围缩小一半。

    int binary_search(int arr[], int n, int target) {
        int lo = 0, hi = n - 1;
        while (lo <= hi) {
            int mid = lo + (hi - lo) / 2;   // 防溢出
            if (arr[mid] == target) return mid;
            else if (arr[mid] < target) lo = mid + 1;
            else hi = mid - 1;
        }
        return -1;  // 未找到
    }

关键: mid = lo + (hi - lo) / 2 而非 (lo + hi) / 2，避免整数溢出。
循环条件: lo <= hi（等号很重要，否则漏掉单元素情况）。
'''

[[exercises.cases]]
args = ["5"]
stdout = "2\n"

[[exercises.cases]]
args = ["6"]
stdout = "-1\n"

[[exercises.cases]]
args = ["1"]
stdout = "0\n"


[[exercises]]
name = "41b_bsearch_recur"
title = "递归二分查找"
unit = "unit2"
lesson = 41
order = 107
mode = "stdout"
source = "41b_bsearch_recur.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/41_binary_search"
hint = '''
递归二分查找: 将迭代版改为递归形式。

    int binary_search_recur(int arr[], int lo, int hi, int target) {
        if (lo > hi) return -1;          // 终止条件
        int mid = lo + (hi - lo) / 2;
        if (arr[mid] == target) return mid;
        if (arr[mid] < target)
            return binary_search_recur(arr, mid + 1, hi, target);
        return binary_search_recur(arr, lo, mid - 1, target);
    }

递归 vs 迭代: 递归代码更清晰，但有栈深度限制。
终止条件: lo > hi 时说明搜索区间为空，返回 -1。
'''

[[exercises.cases]]
args = ["7"]
stdout = "3\n"

[[exercises.cases]]
args = ["10"]
stdout = "-1\n"


[[exercises]]
name = "41c_lower_bound"
title = "lower_bound 左边界查找"
unit = "unit2"
lesson = 41
order = 108
mode = "stdout"
source = "41c_lower_bound.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/41_binary_search"
hint = '''
lower_bound: 找第一个 >= target 的位置。

    int lower_bound(int arr[], int n, int target) {
        int lo = 0, hi = n;        // 注意 hi = n (不是 n-1)
        while (lo < hi) {          // 注意 < (不是 <=)
            int mid = lo + (hi - lo) / 2;
            if (arr[mid] < target)
                lo = mid + 1;      // mid 太小，答案在右半
            else
                hi = mid;          // mid 可能就是答案
        }
        return lo;
    }

与标准二分的区别:
- hi 初始为 n（允许返回"过末端"位置）
- 条件是 lo < hi（不是 <=）
- 找到相等元素时不立即返回，继续缩小右边界
'''

[[exercises.cases]]
args = ["3"]
stdout = "1\n"

[[exercises.cases]]
args = ["6"]
stdout = "4\n"

[[exercises.cases]]
args = ["10"]
stdout = "7\n"


[[exercises]]
name = "41d_bsearch_generic"
title = "泛型二分查找"
unit = "unit2"
lesson = 41
order = 109
mode = "stdout"
source = "41d_bsearch_generic.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/41_binary_search"
hint = '''
泛型二分查找: 用 void* 和函数指针支持任意类型。

    void *generic_bsearch(const void *key, const void *base,
                          int n, int size,
                          int (*cmp)(const void *, const void *)) {
        int lo = 0, hi = n - 1;
        while (lo <= hi) {
            int mid = lo + (hi - lo) / 2;
            const void *elem = (const char *)base + mid * size;
            int r = cmp(key, elem);
            if (r == 0) return (void *)elem;
            else if (r > 0) lo = mid + 1;
            else hi = mid - 1;
        }
        return NULL;
    }

字符串比较器 — 注意参数是 "指向指针的指针":
    int cmp_str(const void *a, const void *b) {
        return strcmp(*(const char **)a, *(const char **)b);
    }

元素地址计算: (char*)base + i * size（void* 不能做算术）。
'''

[[exercises.cases]]
args = ["cherry"]
stdout = "found at 2\n"

[[exercises.cases]]
args = ["grape"]
stdout = "not found\n"
