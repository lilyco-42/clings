[[exercises]]
name = "31a_file_size"
title = "stat 获取文件大小"
unit = "unit2"
lesson = 31
order = 69
mode = "make"
source = "31a_file_size.c"
make_targets = ["test_31a"]
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/31_ls_command"
hint = '''
stat() 系统调用获取文件元数据:

    #include <sys/stat.h>

    struct stat buf;
    if (stat(filename, &buf) != 0) {
        perror(filename);
        return 1;
    }

st_size 字段是文件大小（字节数）:
    printf("size: %lld\n", (long long)buf.st_size);

注意: st_size 的类型是 off_t，在不同平台上可能是 32 位或 64 位。
用 (long long) 强转并配合 %lld 是最安全的做法。

参考: 同目录下的 cmd_ll.c。
'''


[[exercises]]
name = "31b_file_time"
title = "文件修改时间格式化"
unit = "unit2"
lesson = 31
order = 70
mode = "make"
source = "31b_file_time.c"
make_targets = ["test_31b"]
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/31_ls_command"
hint = '''
时间处理的标准流程:

1. stat 获取 st_mtime（time_t 类型）
2. localtime 转为 struct tm:
    struct tm *loctime = localtime(&buf.st_mtime);
3. strftime 格式化输出:
    char buffer[256];
    strftime(buffer, sizeof(buffer), "%Y-%m-%d %H:%M:%S", loctime);
    printf("mtime: %s\n", buffer);

常用格式符:
    %Y 四位年  %m 月  %d 日
    %H 时(24)  %M 分  %S 秒

参考: 同目录下的 cmd_ll.c。
'''


[[exercises]]
name = "31c_ls_l"
title = "ls -l: 完整文件信息"
unit = "unit2"
lesson = 31
order = 71
mode = "make"
source = "31c_ls_l.c"
make_targets = ["test_31c"]
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/31_ls_command"
hint = '''
综合前两题，实现完整的 ls -l:

1. stat() 获取文件信息
2. 解析选项 -i/-s/-T
3. getpwuid() 获取用户名（注意判空！）:
    struct passwd *pw = getpwuid(buf.st_uid);
    printf("file uid = %s\n", pw ? pw->pw_name : "unknown");
4. ctime() 转换时间为字符串:
    printf("file last modify mtime = %s", ctime(&buf.st_mtime));
5. strftime() 格式化时间:
    strftime(buffer, sizeof(buffer),
             "The time is %m %d %H:%M:%S %Y\n", loctime);

注意格式说明符:
    st_ino → %llu + (unsigned long long) 强转
    st_blocks → %lld + (long long) 强转
    st_size → %lld + (long long) 强转

参考: 同目录下的 cmd_ll.c。
'''
