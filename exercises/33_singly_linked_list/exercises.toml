[[exercises]]
name = "33a_make_node"
title = "链表节点创建与释放"
unit = "unit2"
lesson = 33
order = 75
mode = "stdout"
source = "33a_make_node.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/33_singly_linked_list"
hint = '''
链表节点的核心是 malloc + 结构体赋值:

    link make_node(void *data) {
        link p = malloc(sizeof(*p));
        p->data = data;
        p->next = NULL;
        return p;
    }

释放节点时要先释放 data，再释放节点本身:

    void delete_node(link p) {
        free(p->data);
        free(p);
    }

注意: sizeof(*p) 而不是 sizeof(struct node)，这样更安全。
'''

[[exercises.cases]]
stdout = """A
B
C
"""


[[exercises]]
name = "33b_insert_tail"
title = "链表尾插法"
unit = "unit2"
lesson = 33
order = 76
mode = "stdout"
source = "33b_insert_tail.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/33_singly_linked_list"
hint = '''
尾插法: 从头遍历到尾部（p->next==NULL），然后挂新节点:

    link list_insert_tail(link head, link item) {
        link p = head;
        while (p->next != NULL)
            p = p->next;
        p->next = item;
        item->next = NULL;
        return head;
    }

关键: head 是哨兵节点（data=NULL），实际数据从 head->next 开始。
'''

[[exercises.cases]]
stdout = "x -> y -> z\n"


[[exercises]]
name = "33c_list_delete"
title = "链表节点删除"
unit = "unit2"
lesson = 33
order = 77
mode = "stdout"
source = "33c_list_delete.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/33_singly_linked_list"
hint = '''
删除节点的关键: 找到前驱节点 prev，让 prev->next 跳过被删节点:

    link list_delete(link head, link item) {
        link p = head;
        while (p && p->next != item)
            p = p->next;
        if (p) {
            p->next = item->next;
            free(item->data);
            free(item);
        }
        return head;
    }

关键: 从 head 开始找（不是 head->next），这样 head 就是第一个数据节点的"前驱"。
'''

[[exercises.cases]]
stdout = "a -> c\n"


[[exercises]]
name = "33d_list_print"
title = "函数指针遍历打印链表"
unit = "unit2"
lesson = 33
order = 78
mode = "stdout"
source = "33d_list_print.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/33_singly_linked_list"
hint = '''
函数指针遍历: 将"如何打印数据"作为回调参数传入:

    void list_print(link head, void (*pf)(void *)) {
        link p = head->next;  // 跳过哨兵
        while (p) {
            pf(p->data);
            p = p->next;
        }
        printf("\n");
    }

void* 泛型: data 是 void*，回调函数负责类型转换:
    void print_int(void *data) {
        printf("%d ", *(int *)data);
    }
'''

[[exercises.cases]]
stdout = "10 20 30 \n"


[[exercises]]
name = "33e_array_ops"
title = "基于链表的动态数组"
unit = "unit2"
lesson = 33
order = 79
mode = "make"
source = "33e_array_ops.c"
make_targets = ["test_33e"]
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/33_singly_linked_list"
hint = '''
array_insert 的关键: index==0 时特殊处理!

    void array_insert(Array name, int index, char data) {
        char *p = make_data(data);
        link item = make_node(p);
        if (index == 0) {
            list_insert_after(name, item);  // 插到头节点之后
            return;
        }
        Item where = array_at(name, index - 1);
        list_insert_after(where, item);
    }

array_at 遍历链表找第 index 个数据节点:

    Item array_at(Array name, int index) {
        Item p = name;
        int count = -1;
        while (p != NULL) {
            if (count == index) return p;
            p = p->next;
            count++;
        }
        return NULL;
    }

array_length 计数 head->next 之后的节点数。
'''

[[exercises.cases]]
stdout = """['a', 'b', 'c', 'd']
length: 4
"""
