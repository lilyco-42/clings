[[exercises]]
name = "26a_read_magic"
title = "读取 ELF 魔数"
unit = "unit2"
lesson = 26
order = 53
mode = "stdout"
source = "26a_read_magic.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/26_elf_header_parser"
hint = '''
ELF 文件的前 16 字节叫做 e_ident（标识区）。
前 4 字节是固定的魔数: 0x7f, 'E', 'L', 'F'。

检查魔数的方法：
    unsigned char magic[] = { 0x7f, 'E', 'L', 'F' };
    if (memcmp(ident, magic, 4) != 0) {
        printf("Not an ELF file\n");
        return 1;
    }

打印十六进制：
    for (int i = 0; i < 16; i++)
        printf("%02x ", ident[i]);

参考: 同目录下的 readelf.c。
'''

[[exercises.cases]]
compile_only = true


[[exercises]]
name = "26b_parse_header"
title = "解析 ELF Header 结构体"
unit = "unit2"
lesson = 26
order = 54
mode = "stdout"
source = "26b_parse_header.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/26_elf_header_parser"
hint = '''
ELF Header 的关键：

1. 类型必须用无符号整数（地址/偏移不会为负）：
   typedef unsigned short Elf32_Half;  // 2 字节
   typedef unsigned int   Elf32_Word;  // 4 字节

2. 结构体必须加 packed 防止编译器插入填充字节：
   typedef struct __attribute__((packed)) { ... } Elf32_Ehdr;

3. 读取方式：将整块内存 fread 后强转为结构体指针
   char buf[sizeof(Elf32_Ehdr)];
   fread(buf, 1, sizeof(Elf32_Ehdr), fp);
   Elf32_Ehdr *p = (Elf32_Ehdr *)buf;
   printf("Type: %u\n", p->e_type);

参考: 同目录下的 readelf.c。
'''

[[exercises.cases]]
compile_only = true


[[exercises]]
name = "26c_file_type"
title = "ELF 文件类型识别"
unit = "unit2"
lesson = 26
order = 55
mode = "stdout"
source = "26c_file_type.c"
lesson_url = "https://cnb.cool/q.qq/opencamp-c-2026-summer/Unit-2-C-Essentials/-/tree/main/lessons/26_elf_header_parser"
hint = '''
用结构体数组实现数字到字符串的映射（查表法）：

struct type_string {
    int type;
    const char *string;
} table[] = {
    { 0, "NONE (No file type)" },
    { 1, "REL (Relocatable file)" },
    { 2, "EXEC (Executable file)" },
    { 3, "DYN (Shared object file)" },
    { -1, "Unknown" },
};

查表函数：遍历数组，找到 type 匹配的项返回其 string；
找不到则返回最后一项（"Unknown"）。

这种"数据驱动"的设计模式在系统编程中非常常见。

参考: 同目录下的 readelf.c。
'''

[[exercises.cases]]
compile_only = true
